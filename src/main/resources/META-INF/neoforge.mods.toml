modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# 模组封面：游戏内「Mods / 模组列表」界面与各类启动器「模组管理」里本模组的展示图。
# 路径相对 jar 根目录；r19 起指向 jar 根部的 logo.png（与 assets 下那份是同一张图，
# 根目录短路径对最多加器友好度最高）。图在用户提供的封面基础上把白色背景重绘成了
# 深色电路板科技风（生成脚本 tools/make_cover.py，可复跑，会自动同步两处文件）。
logoFile="logo.png"
authors="AutoMods"
description='''修复 GTM (GregTech CEu Modern) 8.0.0-SNAPSHOT 在 1.21.1 / NeoForge 上的启动崩溃与 JEI 显示问题，仅客户端生效。【崩溃一·启动】GTRecipeCategories 静态初始化抢在 JEI 就绪前调用 GTJEIPlugin.getRuntime() 导致 NPE；未就绪时用「会自动恢复的占位图标」顶替，JEI 就绪后在被用到的那一刻自动换成真实图标。【分类缺失】GTM 该快照把主配方分类的注册行注释掉了（装了 EMI 时还会被它自己的守卫整体跳过），于是 JEI 里一个格雷分类都看不到；本模组在 GTM 的 registerCategories / registerRecipes 进门口接管，按 GTM 自己的注册表原顺序重放注册——优先用格雷原生页面类，构造失败才退回本模组兜底页（uid 去重，GTM 已注册的不重复补；每步独立容错，单条失败不影响启动）。【崩溃二·配方页】新版 JEI 重构掉了 ModularUI 依赖的 RecipeSlot 内部字段，一点开配方页就 MixinApplyError 崩溃；本模组在类转换最早时机把缺的字段补回去（老 JEI 原样跳过）。【显示问题一·3D 结构图】JEI 里格雷的多方块 3D 结构图偏左上角：那张图是 ModularUI 直接设 OpenGL 视口渲的，视口不跟 GuiGraphics 的位姿走，而 MUI 3.3.1 的内嵌界面压根不知道 JEI 把页面平移到了屏幕哪里；本模组在绘制现场读出页面真实原点并补进视口，结构图与鼠标点选一起摆正。【显示问题二·弹出菜单】控制器「缺失的方块」列表里，越往下的行展开「可使用的类型」那排方块也越往下，最后几行整个开出屏幕外看不见：这份列表是一个 130 高的可滚动列表，而 ModularUI 的滚动只是绘制时的矩阵平移、绝不回填进子部件坐标，菜单又永远开在按钮下方且全库没有自动翻转，所以它照的是「没滚动」的位置。本模组站在 ModularUI 排版链的最后一拍，先把那一行按钮的滚动位移减掉，再按按钮在屏幕上真正的位置重摆菜单——原样放得下就一个字节不动，放不下就翻到按钮另一侧（往上开，仍贴着它所属那一行）；认不出那一行的按钮、或这张界面不是窗口本身（比如 JEI 里的内嵌虚拟屏）时完全不动，绝不往屏幕边上贴（r28 引入，r30、r31 两次重写：r28 是「越界就往屏幕边贴」，r30 补了按钮但漏了滚动位移，两版都会把整排菜单从它那一行摘走）。【排查】每一步干没干活都会实时写进游戏根目录的 gtm_jei_fix_report.txt，并在 gtm_jei_logs/ 里每次启动留一份不覆盖的带时间戳日志；进世界后聊天栏还会自动打几行结论。'''

[[mixins]]
config = "gtm_jei_startup_fix.mixins.json"

# r17：独立的低 priority mixin 配置（priority 900 < ModularUI/格雷默认的 1000；
# Mixin 的自然顺序是数字小的先应用）。
# 用途：玩家第一次打开配方页时，JEI 的 RecipeSlot 类被加载转换，本配置抢在
# ModularUI 的 @Accessor 之前把新版 JEI（19.3x 起重构）删掉的
# allIngredients / displayIngredients 两个字段补回该类，
# 消除「一点格雷配方页就崩（MixinApplyError: RecipeSlotAccessor）」的问题。
# 单独一份配置是为了把「调整应用顺序」的影响面只限制在这个新锚 mixin 上，
# 上面那份原有配置里三条 mixin 的行为与应用顺序保持原样。
[[mixins]]
config = "gtm_jei_startup_fix_jeicompat.mixins.json"

# r24：修「JEI 里格雷的多方块 3D 结构图偏左上角」。
# 那张图不是贴图，是 ModularUI 直接设 OpenGL 视口（RenderSystem.viewport）渲出来的，
# 而 GL 视口不跟 GuiGraphics 的位姿走；ModularUI 3.3.1 的内嵌界面（UIType.EMBED）
# 从头到尾不知道 JEI 把这块页面平移到了屏幕哪个位置（EmbedHandler.EmbedWrapper.updateGuiArea
# 在 MUI 3.3.1 里是个空方法），于是视口按「页面左上角＝窗口左上角」来算，图整体偏左上角。
# 这两条 mixin 只配在客户端（配置里的 "client" 数组）：一条在 JEI 画内嵌界面的入口读到位姿平移量，
# 一条把它加到 GL 视口的入参上，顺带把「点哪个方块」的射线拾取一起摆正。
# 目标类都来自 ModularUI：没装 MUI 时那些类永不被加载，两条 mixin 自然不触发；
# injectors.defaultRequire=0 保证 MUI 将来换版本、签名对不上时也只是不生效，绝不把游戏带崩。
#
# r28 又往这份配置里加了两条：修「控制器里越靠下的缺失方块，展开『可使用的类型』那排方块
# 越靠下、甚至超出屏幕」。ModularUI 3.3.1 的弹出菜单方向是写死的（Direction.DOWN → 开在按钮下方），
# 全仓库没有任何贴屏幕边界/自动翻转的逻辑，格雷也没改方向，于是菜单跟着按钮一路开到屏幕外。
# 这两条钉在 MUI 排版链的最后一拍 postFullResize() 上：一条给 WidgetResizeNode，
# 一条给它的父类 WidgetNode——「这个方法到底声明在哪一层」我们只有官方源码这一份依据
# （ModularUI 是格雷 jar 里的 jar-in-jar，本地没有 jar 可 javap 确证），所以两层都钉：
# 谁声明就谁命中；两条同时命中也只调一次（校正逻辑自己保证幂等）。
#
# r30 换掉了这两条后面的摆法（挂钩位置一字未动）：r28 是「越出可视区多少就往回挪多少」，
# 于是要么完整留在原地、要么整排黏到同一条屏幕边，脱离它所属的那一行；现在改成读菜单的
# 排版父（MUI 里那句 relative(按钮) 就是把它设成那个按钮）算出绝对目标位，放不下就翻到
# 按钮另一侧。同时不再「往 ry 上加位移」而是写绝对值：MUI 的 preApplyPos 会把 ry 当成
# 排版规格值读回去（Area.applyPos），加上去的位移会被下一次排版吃掉再推一遍。
[[mixins]]
config = "gtm_jei_startup_fix_muicompat.mixins.json"
# r31 第二次重写（r30 的现场日志暴露它仍然少一个量）：缺失部件列表在格雷那边是一个 130 高的可滚动
# ListWidget，而 MUI 的 AbstractScrollWidget.transformChildren 只做 stack.translate(-scrollX, -scrollY)，
# 子部件（以及照着子部件摆的菜单）的绝对坐标永远不含滚动位移。r31 沿父链把这个位移累加出来减掉，
# 再按按钮在屏幕上真正的位置摆；同时删掉「实在放不下就往屏幕边贴」的兜底（玩家看到的「顶到左上角」
# 就是它），并且只承认「窗口本身那张屏」——MUI 自己标的 UIType.EMBED 虚拟屏（JEI 内嵌页）一概不动。原本钉在 brachy.modularui.widget.WidgetNode 上的
# 第二条挂钩也删了——该版本 525 个 java 文件里查无此类，它从 r28 到 r30 一次都没命中过。

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# 这是 GTM 的配套修复模组：目标类来自 GTM，被拦截的方法签名引用 JEI API。
# 缺少任意一个时 Mixin 无处生效，因此声明为必需依赖。
[[dependencies.${mod_id}]]
modId="gtceu"
type="required"
versionRange="[7,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="required"
versionRange="[19,)"
ordering="NONE"
side="BOTH"
