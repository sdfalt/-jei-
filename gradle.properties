org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.java.installations.paths=/opt/jdks/java-8,/opt/jdks/java-17,/usr/lib/jvm/java-21-openjdk-amd64,/opt/jdks/java-25
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
# 运行期要求的 NeoForge 最低版本（写进 mods.toml 的依赖声明）。
# 与上面的 neo_version 分开：neo_version 只是编译时用的开发环境版本；
# 本模组用到的全部 NeoForge 接口（@Mod、事件总线、ClientTickEvent、FluidStack.getAmount、
# FML 工具类，以及 [[mixins]] 内建 Mixin 机制）在 21.1.x 全系列一字未变，
# 所以依赖下界可以安全降到 21.1.235（用户指定值）。
neo_version_range=[21.1.235,)
loader_version_range=[1,)
mod_id=gtm_jei_startup_fix
mod_name=GTM JEI Startup Crash Fix
mod_license=MIT
# r32：新增配置文件 config/gtm_jei_startup_fix.toml（NeoForge 自带 ModConfigSpec，注释中英双语），
# 里面就管玩家要的两件事：
#   ① messages.joinChatReminder —— 每次进入游戏时聊天栏弹出的那几行提醒发不发（默认 true）；
#   ② logs.startupLogKeep —— gtm_jei_logs 里保留几份启动日志（默认 20；填 40 留 40 份，
#      填 -1 一份都不删）。原来写死的 20 份就此变成可配置。
# r34：配置扩成四组 + 游戏内命令：
#   ① [fixes] 五个修复各自独立开关（启动崩溃 / 格雷分类补注册 / RecipeSlot 字段 / 多方块预览 /
#      弹出菜单不出屏），默认全 true＝行为与 r32 一字不差；
#   ② [logs] writeStartupLog 与 [report] enabled 两个写文件总开关（关掉＝本次一个字节都不写）；
#   ③ 客户端命令 /gtmfix status｜reload｜report（看开关 / 改完配置立刻重读生效 / 拿报告路径）。
# r36：排查升级（五项修复本体一字未动，只是多了「坏了自己会喊」的能力）：
#   ① 静默失效自检（FixHealth）——muicompat 的 defaultRequire=0 让「注入目标找不到」时宁可跳过不崩，
#      代价是格雷/ModularUI/JEI 更新后校正可能一声不响地不干活。现在用「目标类/方法反射预检
#      ＋挂钩运行时计数」双判据，可疑就在现场报告、逐行日志与进世界聊天栏明写 ⚠；
#   ② 本模组版本写进逐行日志头部与 /gtmfix status（原先只有报告里有），并扫描 mods 文件夹：
#      装了不止一份 gtm_jei_startup_fix*.jar 就提示只留最新那一份；
#   ③ 上次启动异常退出反查：旧日志末尾缺「进程退出」收尾行＝上次硬崩/被强杀，进游戏时提醒并指路。
# r37：配置防呆（ConfigGuard，修复本体依旧一字未动）：手改 toml 把某项填坏时 NeoForge 全是静默处理——
#   看不懂的写法回默认、超范围的数字夹到边界（-5 → -1「一份都不删」而不是回默认 20！）、
#   4.5 这种 test 能过的会被 getInt 截断成 4 用且连文件都不改、拼错的键整行删掉、
#   整份语法坏掉＝原文备份成 -1.toml.bak 后重建全默认。以上每种现在都会明说一句
#   「这一项看不懂，本次按默认 X 走」，进逐行日志 / 现场报告 / 聊天栏 / 游戏内 status 与 reload 回显。
#   实现＝往模组与 FML 之间包一层旁观的 IConfigSpec：FML 每次读文件都先问注册的 spec
#   「这份对不对」，那一刻玩家原文还没被动过，用 ModConfigSpec 自己的 test/correct 判一遍即可
#   （判据细节与实测记录见 tools 下 ground-truth 目录里 neoforge-1.21.1-config-correction-facts.md）。
# r37：配置防呆（ConfigGuard，修复本体依旧一字未动）：手改 toml 把某项填坏时 NeoForge 全是静默处理——
#   看不懂的写法回默认、超范围的数字夹到边界（-5 → -1「一份都不删」而不是回默认 20！）、
#   4.5 这种 test 能过的会被 getInt 截断成 4 用且连文件都不改、拼错的键整行删掉、
#   整份语法坏掉＝原文备份成 -1.toml.bak 后重建全默认。以上每种现在都会明说一句
#   「这一项看不懂，本次按默认 X 走」，进逐行日志 / 现场报告 / 聊天栏 / gtmfix 的 status 与 reload。
#   实现＝往模组与 FML 之间包一层旁观的 IConfigSpec：FML 每次读文件都先问注册的 spec
#   「这份对不对」，那一刻玩家原文还没被动过，用 ModConfigSpec 自己的 test/correct 判一遍即可
#   （判据细节与实测记录见 tools/ground-truth/neoforge-1.21.1-config-correction-facts.md）。
# 时序坑（用 21.1.244 真 jar 核实过，别再踩）：NeoForge 在「模组构造之后」才加载 COMMON 配置，
# 构造函数里 ConfigValue#get() 会抛 IllegalStateException，所以取值一律走 FixConfig 的兜底方法，
# 旧日志清理挂在 ModConfigEvent.Loading/Reloading 上（构造时就按默认 20 清会误删玩家要留的份）；
# r34 起「建逐行日志」与「报告落盘」同样推迟到配置到手那一刻才决定，
# writeStartupLog / report.enabled 的「关掉就一个字节都不写」承诺才成立（5 秒轮询兜底防配置事件不来）。
# r39：适配 GTM 快照 01bda09（maven build 96，gtceu 自报 version="8.0.0-SNAPSHOT+01bda09"）：
#   拿用户实装同一份 jar 全量 javap 复核七条 mixin 挂钩与全部反射钉点——逐字节一致、零漂移
#   （build 95→96 官方源码 diff 只有 5 个 AE2/Jade 文件，与本模组接触面零交集）；
#   崩溃链（CategoryIcon 抢跑 getRuntime）在 01bda09 依旧存在，五项修复一个不能少。
#   顺带把格雷内嵌的 modularui-mc1.21.1-3.3.1-SNAPSHOT.jar 的字节码取到本地，
#   muicompat 三条挂钩的证据等级由「源码」升为「javap 确证」，require=0 按约定不变；
#   真值存档 tools/ground-truth/gtceu-8.0.0-snapshot.javap.txt 与
#   modularui-nested-in-gtceu-01bda09.javap.txt。修复逻辑一字未动，版本号照升——
#   描述文字与真值都在为「哪个快照核过」作证，不升就分不清 r38（只核到旧快照）和这版。
# 版本号必须跟着走：jar 文件名与三份会打进包里的描述文字都以此为唯一凭据，
# 不升就会出现「同一个文件名、两份不同内容」——用户没法判断自己手上那个是不是最新的。
mod_version=1.0.0-r39
mod_group_id=cn.blockforge.gtmjeifix

# 与用户实装的 JEI 完全同版本；只用于编译期核对类名/方法名，不打进成品
# （19.56.0.441：用户从 19.27 升级后的实际安装；已逐字节 diff 过本模组用到的接口，两版零差异）
jei_version=19.56.0.441
