[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="AutoMods"
description="修复 GregTech CEu Modern (GTM) 8.0.0-SNAPSHOT 的启动崩溃与 JEI 显示问题：启动 NPE、JEI 里格雷配方分类缺失、点开配方页崩溃、多方块 3D 结构图偏左上角、控制器「可使用的类型」菜单开出屏幕外（先把该行按钮的滚动位移减掉再按真实位置重摆，放不下就翻到按钮上方；认不准就完全不动）。仅客户端生效；【配置】config/gtm_jei_startup_fix.toml（r32 新增，r34 扩成四组，注释中英双语）：[fixes] 五个修复各一个独立开关（默认全开）；[messages] joinChatReminder 控制进世界聊天提醒开/关；[logs] startupLogKeep 控制 gtm_jei_logs 保留几份启动日志（-1 = 一份都不删）+ writeStartupLog 建不建日志文件；[report] enabled 写不写现场报告——两个写开关关掉＝本次启动一个字节都不写。【命令】/gtmfix status｜reload｜report（看开关 / 改完立刻生效 / 拿报告路径，不需要作弊权限）。【排查升级·r36】修复本体一字未动，新增：校正自检（格雷/ModularUI/JEI 更新导致某项校正静默不生效时，报告/日志/进世界提醒明写 ⚠ 并教你发哪份文件）、本模组版本写进逐行日志头部与 status、mods 里装了多份同名 jar 时提醒只留最新、上次没正常退出（崩溃/强杀）下次进游戏会提醒并指路旧日志。【配置防呆·r38】手改配置把某项填坏（abc、写成带引号的「40」、小数 4.5、超出 -1 ~ 10000 的数、键名拼错、整份语法写坏）时，游戏原本只会静默回默认/夹边界/删行/重建（原文进 .bak 备份），你以为生效了其实没有；现在模组在读配置时用游戏自己的判据先审一遍原文，每条没被原样采用的项都明说「这一项看不懂，本次按默认 X 走」，逐行日志、现场报告、进世界聊天与 gtmfix 的 status/reload 回显四处同步。【快照适配·r39】格雷 8.0.0-SNAPSHOT 最新快照 +01bda09（maven build 96）逐条复核：本模组全部挂钩与反射目标在其字节码上一字未变，崩溃链原样存在，五项修复照旧全量生效，行为与 r38 一字不差。运行日志见游戏根目录 gtm_jei_fix_report.txt。"

