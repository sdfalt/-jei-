org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.java.installations.paths=/opt/jdks/java-8,/opt/jdks/java-17,/usr/lib/jvm/java-21-openjdk-amd64,/opt/jdks/java-25
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.244
# 运行期要求的 NeoForge 最低版本（写进 mods.toml 的依赖声明）。
# 与上面的 neo_version 分开：neo_version 只是编译时用的开发环境版本；
# 本模组用到的全部 NeoForge 接口（@Mod、事件总线、ClientTickEvent、FluidStack.getAmount、
# FML 工具类，以及 [[mixins]] 内建 Mixin 机制）在 21.1.x 全系列一字未变，
# 所以依赖下界可以安全降到 21.1.235（用户指定值）。
neo_version_range=[21.1.235,)
loader_version_range=[1,)
mod_id=gtm_jei_startup_fix
mod_name=GTM JEI Startup Crash Fix
mod_license=MIT
mod_version=1.0.0-r20
mod_group_id=cn.blockforge.gtmjeifix

# 与用户实装的 JEI 完全同版本；只用于编译期核对类名/方法名，不打进成品
# （19.56.0.441：用户从 19.27 升级后的实际安装；已逐字节 diff 过本模组用到的接口，两版零差异）
jei_version=19.56.0.441
