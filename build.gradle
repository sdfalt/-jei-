plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// ---- JEI 官方 API：只参与编译，绝不进成品 jar ----
// 为什么这里必须用真家伙（r6、r7 两次崩溃都是在这一步偷的懒）：
//   1) Mixin 的 @Inject 回调要与目标方法逐字节同签名，回调参数得写成真实接口类型
//      （写 Object → InvalidInjectionException: Invalid descriptor → 模组加载失败，即 r6）；
//   2) 更关键：Mixin 转换 Mixin 类自身时，会解析方法描述符**和局部变量表**里的每一个类名。
//      r7 用几个「只有名字的空接口」当锚点又不打进 jar，其中 ICatalystRegistration、
//      IMenuCategoryDataRegistrar 两个名字在 JEI 19 里根本不存在（前者现名
//      IRecipeCatalystRegistration，后者已被移除），运行期直接抛
//      ClassMetadataNotFoundException —— require = 0 也救不了，因为炸的是「类转换」而不是「方法匹配」。
// 现在直接依赖 JEI 官方 api jar，与用户实装的 19.56.0.441 **同一版本**：
// 类名写错就编译不过，错不到玩家的游戏里去了。
// （r8 时用户实装 19.27.0.340；本模组用到的所有接口在两版之间逐字节一致，
//   r9 起对齐到玩家机器上真正跑着的那一份。）
//
// jar 从哪来：JEI 文档给的 maven https://modmaven.dev/mezz/jei/jei-1.21.1-common-api/<版本>/
// 已下载并随工程固定到 libs/（共 140KB，SHA1 见 README「构建」一节），
// 好处是编译不需要网络、也不可能被别的版本悄悄替换。
// 升级版本时：下载同名两个 jar 放进 libs/，同时改 gradle.properties 里的 jei_version。
dependencies {
    compileOnly files("libs/jei-1.21.1-common-api-${jei_version}.jar",
                      "libs/jei-1.21.1-neoforge-api-${jei_version}.jar")
}
// 双保险：compileOnly 本来就不打包，再显式挡一道，防止将来有人改成 implementation。
jar { exclude 'mezz/**' }
processResources {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, neo_version_range: neo_version_range,
                 loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    // META-INF/mods.toml（r19 新增）：给第三方启动器的「兼容副本」。
    // NeoForge 把模组元数据改名为 META-INF/neoforge.mods.toml；HMCL 旧版只认旧文件名
    // （新版两个都读），读不到旧文件名就展示不出 logoFile 封面。
    // 为什么放它绝对安全（已反汇编本工程所用 FML loader-4.0.43 核实）：
    //   1) ModDiscoverer$DiscoveryPipeline.addJarContent 只在所有 reader 都读不出
    //      mod 文件时才走 IncompatibleModReason.detect()；我们的 jar 有
    //      neoforge.mods.toml，JarModsDotTomlModFileReader 必然成功，轮不到这个检查；
    //   2) detect() 里 MINECRAFT_FORGE 的判定是"存在 META-INF/mods.toml"，仅对
    //      读不出来的 jar 生效，对本 jar 永远不可达。
    // 该副本刻意无注释、无多行字符串：兼容的正是语法支持最差的解析器。
    //
    // mcmod.info（r20 新增）：给 PCL2 社区版（PCL2-CE）的封面入口。
    // 核实过 PCL2-CE 源码 Modules/Minecraft/ModLocalComp.cs：它的「本地识别」里
    // 只有 mcmod.info / fabric.mod.json / quilt.mod.json 三个分支会从 jar 里
    // 提取 logoFile 图片；mods.toml / neoforge.mods.toml 分支只取名称/描述/版本，
    // 不取封面。Forge 1.13+/NeoForge 游戏本体完全不读 mcmod.info（那是 1.12- 的
    // 元数据），放一份纯粹是给人性化启动器看的，对游戏零影响。
    // 注意：官方 PCL2（pcl2.com 版本）经源码核实根本不打开模组 jar，图标只按
    // 文件 sha1 联网匹配 Modrinth/CurseForge，本地构建的 jar 在官方 PCL2 里
    // 无法显示自带封面——这不是元数据能解决的，已在交付说明里如实告知用户。
    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'mcmod.info']) { expand props }
}
