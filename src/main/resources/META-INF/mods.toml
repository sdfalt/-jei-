[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="AutoMods"
description="修复 GregTech CEu Modern (GTM) 8.0.0-SNAPSHOT 的启动崩溃与 JEI 显示问题：启动 NPE、JEI 里格雷配方分类缺失、点开配方页崩溃、多方块 3D 结构图偏左上角、控制器「可使用的类型」菜单开出屏幕外（先把该行按钮的滚动位移减掉再按真实位置重摆，放不下就翻到按钮上方；认不准就完全不动）。仅客户端生效；【配置】config/gtm_jei_startup_fix.toml（r32 新增，r34 扩成四组，注释中英双语）：[fixes] 五个修复各一个独立开关（默认全开）；[messages] joinChatReminder 控制进世界聊天提醒开/关；[logs] startupLogKeep 控制 gtm_jei_logs 保留几份启动日志（-1 = 一份都不删）+ writeStartupLog 建不建日志文件；[report] enabled 写不写现场报告——两个写开关关掉＝本次启动一个字节都不写。【命令】/gtmfix status｜reload｜report（看开关 / 改完立刻生效 / 拿报告路径，不需要作弊权限）。【排查升级·r36】修复本体一字未动，新增：校正自检（格雷/ModularUI/JEI 更新导致某项校正静默不生效时，报告/日志/进世界提醒明写 ⚠ 并教你发哪份文件）、本模组版本写进逐行日志头部与 status、mods 里装了多份同名 jar 时提醒只留最新、上次没正常退出（崩溃/强杀）下次进游戏会提醒并指路旧日志。【配置防呆·r38】手改配置把某项填坏（abc、写成带引号的「40」、小数 4.5、超出 -1 ~ 10000 的数、键名拼错、整份语法写坏）时，游戏原本只会静默回默认/夹边界/删行/重建（原文进 .bak 备份），你以为生效了其实没有；现在模组在读配置时用游戏自己的判据先审一遍原文，每条没被原样采用的项都明说「这一项看不懂，本次按默认 X 走」，逐行日志、现场报告、进世界聊天与 gtmfix 的 status/reload 回显四处同步。【快照适配·r39】格雷 8.0.0-SNAPSHOT 快照 +01bda09（maven build 96）逐条复核：本模组全部挂钩与反射目标在其字节码上一字未变，崩溃链原样存在，五项修复照旧全量生效，行为与 r38 一字不差。【快照适配·r43】格雷 8.0.0-SNAPSHOT 最新快照 +3a1493f（maven build 100）复核：全部挂钩与反射目标对照 01bda09 逐行一致、零漂移，崩溃链原样存在，五项修复照旧全量生效，行为与 r40 一字不差。【服务端·r40】纯客户端补丁：五项修复钉的全是只有物理客户端才加载的类，专用服务端不会触发这些毛病、也无需本模组；格雷/JEI 依赖改为仅客户端侧声明（side=CLIENT，必须大写），误装到没带 JEI 的服务器不再拖垮开服，模组在服务端只记一行闲置说明；本模组不注册网络通道，客户端装没装都不影响进服。【紧急修正·r45】r40~r43 该值误写为小写 client，而加载器按枚举常量名大小写敏感地解析 side 字段，导致这三版 jar 在客户端启动即被判无效文件而崩溃（No enum constant ...DependencySide.client）；r45 改为大写 CLIENT，依赖语义不变（客户端仍强制要求格雷+JEI，专用服务端按侧跳过），五项修复与其余行为相对 r43 零改动，格雷 +3a1493f（build 100）兼容结论继续有效。运行日志见游戏根目录 gtm_jei_fix_report.txt。"

